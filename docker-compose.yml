services:
  # PostgreSQL database with pg_cron extension
  db:
    build:
      context: ./services/database
      dockerfile_inline: |
        FROM postgres:15-bookworm
        RUN apt-get update && \
            apt-get -y install postgresql-15-cron && \
            apt-get clean && \
            rm -rf /var/lib/apt/lists/*
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: Mount optimized config for bulk loading
      # Uncomment the line below when running bulk import
      # - ./services/sync-bigquery/postgres-bulk-load.conf:/etc/postgresql/postgresql.conf:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sourcify}
      POSTGRES_USER: ${POSTGRES_USER:-sourcify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sourcify}
      # Set higher memory limits for bulk loading (adjust based on available RAM)
      # Uncomment these when running bulk import
      # POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS:-2GB}
      # POSTGRES_WORK_MEM: ${POSTGRES_WORK_MEM:-256MB}
      # POSTGRES_MAINTENANCE_WORK_MEM: ${POSTGRES_MAINTENANCE_WORK_MEM:-2GB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_cron"
      - "-c"
      - "cron.database_name=${POSTGRES_DB:-sourcify}"
      # Bulk loading optimizations (set via env vars or config file)
      # Uncomment when running bulk import
      # - "-c"
      # - "config_file=/etc/postgresql/postgresql.conf"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sourcify}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sourcify-network
    # Increase shared memory for PostgreSQL (important for large shared_buffers)
    shm_size: 2gb

  # Database migrations
  migrations:
    image: node:22.5.1-bookworm-slim
    volumes:
      - ./services/database:/home/app/services/database
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-sourcify}:${POSTGRES_PASSWORD:-sourcify}@db:5432/${POSTGRES_DB:-sourcify}?sslmode=disable"
    command: /bin/bash -c "cd /home/app/services/database && npm install && npm run migrate:up"
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sourcify-network

  # Main Sourcify server
  server:
    build:
      context: .
      dockerfile: services/server/Dockerfile
    ports:
      - "${SERVER_PORT:-5555}:5555"
    environment:
      SOURCIFY_POSTGRES_HOST: db
      SOURCIFY_POSTGRES_DB: ${POSTGRES_DB:-sourcify}
      SOURCIFY_POSTGRES_USER: ${POSTGRES_USER:-sourcify}
      SOURCIFY_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sourcify}
      SOURCIFY_POSTGRES_PORT: 5432
      NODE_ENV: ${NODE_ENV:-development}
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      INFURA_API_KEY: ${INFURA_API_KEY:-}
      DRPC_API_KEY: ${DRPC_API_KEY:-}
      ZIRCUIT_API_KEY: ${ZIRCUIT_API_KEY:-}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
    volumes:
      - ./services/server/src/sourcify-chains-default.json:/home/app/services/server/dist/sourcify-chains.json:ro
      - ./services/server/src/config:/home/app/services/server/dist/config:ro
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - sourcify-network

  # 4byte signature service
  4byte:
    build:
      context: .
      dockerfile: services/4byte/Dockerfile
    ports:
      - "${FOURBYTE_PORT:-4444}:4444"
    environment:
      FOURBYTES_POSTGRES_HOST: db
      FOURBYTES_POSTGRES_DB: ${POSTGRES_DB:-sourcify}
      FOURBYTES_POSTGRES_USER: ${POSTGRES_USER:-sourcify}
      FOURBYTES_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sourcify}
      FOURBYTES_POSTGRES_PORT: 5432
      PORT: 4444
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - sourcify-network

  # Monitor service
  monitor:
    build:
      context: .
      dockerfile: services/monitor/Dockerfile
    environment:
      ALCHEMY_API_KEY: ${ALCHEMY_API_KEY:-}
      INFURA_API_KEY: ${INFURA_API_KEY:-}
      DRPC_API_KEY: ${DRPC_API_KEY:-}
      ZIRCUIT_API_KEY: ${ZIRCUIT_API_KEY:-}
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID:-}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET:-}
      NODE_ENV: ${NODE_ENV:-development}
      NODE_LOG_LEVEL: ${NODE_LOG_LEVEL:-info}
    volumes:
      - ./services/monitor/monitorChains.json:/home/app/services/monitor/monitorChains.json:ro
    depends_on:
      server:
        condition: service_started
    networks:
      - sourcify-network

  # BigQuery sync service - OPTIMIZED (10-50x faster)
  # Uses COPY instead of INSERT, index management, parallel processing
  # Recommended for bulk imports of 1M+ rows
  sync-bigquery-optimized:
    build:
      context: ./services/sync-bigquery
      dockerfile: Dockerfile
    command: ["python", "/app/sync_bigquery_optimized.py"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-sourcify}
      POSTGRES_USER: ${POSTGRES_USER:-sourcify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sourcify}
      POSTGRES_PORT: 5432
      # Optimized settings (can be overridden in .env)
      BATCH_SIZE: ${SYNC_BATCH_SIZE:-100000}
      NUM_WORKERS: ${SYNC_NUM_WORKERS:-3}
      USE_COPY: ${SYNC_USE_COPY:-true}
      MANAGE_INDEXES: ${SYNC_MANAGE_INDEXES:-true}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-n8n-self-468309}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/app/gcp-key.json}
    volumes:
      - ./services/sync-bigquery/logs:/app/logs
      - ${GCP_KEY_PATH:-./services/sync-bigquery/gcp-key.json}:/app/gcp-key.json:ro
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - sourcify-network
    profiles:
      - manual

  # BigQuery sync scheduler (runs daily, automated)
  # Now uses optimized sync by default for better performance
  sync-bigquery-scheduler:
    build:
      context: ./services/sync-bigquery
      dockerfile: Dockerfile
    command: ["python", "/app/scheduler.py"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-sourcify}
      POSTGRES_USER: ${POSTGRES_USER:-sourcify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sourcify}
      POSTGRES_PORT: 5432
      # Optimized settings (matching sync-bigquery-optimized)
      BATCH_SIZE: ${SYNC_BATCH_SIZE:-100000}
      NUM_WORKERS: ${SYNC_NUM_WORKERS:-3}
      USE_COPY: ${SYNC_USE_COPY:-true}
      MANAGE_INDEXES: ${SYNC_MANAGE_INDEXES:-true}
      SYNC_MODE: ${SYNC_MODE:-incremental}
      SYNC_SCHEDULE: ${SYNC_SCHEDULE:-0 2 * * *}
      RUN_ON_STARTUP: ${RUN_ON_STARTUP:-false}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-n8n-self-468309}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/app/gcp-key.json}
    volumes:
      - ./services/sync-bigquery/logs:/app/logs
      - ${GCP_KEY_PATH:-./services/sync-bigquery/gcp-key.json}:/app/gcp-key.json:ro
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - sourcify-network

  # Parquet sync service - FASTEST (10-100x faster than BigQuery)
  # Downloads pre-exported parquet files from Sourcify's public export
  # Recommended for initial bulk loads and periodic full refreshes
  sync-parquet:
    build:
      context: ./services/sync-bigquery
      dockerfile: Dockerfile
    command: ["python", "/app/sync_parquet.py"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-sourcify}
      POSTGRES_USER: ${POSTGRES_USER:-sourcify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sourcify}
      POSTGRES_PORT: 5432
      # Parquet sync settings
      MANIFEST_URL: ${MANIFEST_URL:-https://export.sourcify.dev/manifest.json}
      PARQUET_BASE_URL: ${PARQUET_BASE_URL:-https://export.sourcify.dev}
      DOWNLOAD_DIR: ${DOWNLOAD_DIR:-/tmp/parquet}
      USE_COPY: ${SYNC_USE_COPY:-true}
      MANAGE_INDEXES: ${SYNC_MANAGE_INDEXES:-true}
    volumes:
      - ./services/sync-bigquery/logs:/app/logs
      - /tmp/parquet:/tmp/parquet  # Temporary storage for downloaded files
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - sourcify-network
    profiles:
      - manual

volumes:
  postgres_data:

networks:
  sourcify-network:
    driver: bridge
