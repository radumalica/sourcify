# PostgreSQL Configuration for Bulk Loading
# Optimized for high-throughput data import with 10M+ rows
#
# These settings prioritize write performance over crash recovery safety.
# For production use after bulk load is complete, revert to standard settings.

# ============================================================================
# CONNECTION SETTINGS
# ============================================================================

# Listen on all interfaces so Docker containers can connect
listen_addresses = '*'

# Allow connections from Docker network
# (pg_hba.conf handles authentication)

# ============================================================================
# MEMORY SETTINGS
# ============================================================================

# Increase shared buffers for better caching (25% of RAM recommended)
# Adjust based on available memory (e.g., 2GB for 8GB RAM, 4GB for 16GB RAM)
shared_buffers = 2GB

# Increase work memory for sorting and hash operations
# Used per operation, so don't set too high if many concurrent connections
work_mem = 256MB

# Increase maintenance work memory for index creation, VACUUM, etc.
# This is crucial for fast index rebuilding after bulk import
maintenance_work_mem = 2GB

# Increase effective cache size (50-75% of total RAM)
# This tells the planner how much memory is available for caching
effective_cache_size = 6GB

# ============================================================================
# WRITE-AHEAD LOG (WAL) SETTINGS - PERFORMANCE MODE
# ============================================================================

# Disable synchronous commit for massive performance gain
# Data is still durable, but there's a small window for data loss on crash
synchronous_commit = off

# Increase WAL buffers for better write performance
wal_buffers = 16MB

# Increase checkpoint distance to reduce checkpoint overhead
# WARNING: Recovery time increases with larger checkpoints
checkpoint_timeout = 30min
max_wal_size = 4GB
min_wal_size = 1GB

# Reduce checkpoint completion target for smoother I/O
checkpoint_completion_target = 0.9

# ============================================================================
# QUERY PLANNER
# ============================================================================

# Disable JIT compilation (can slow down bulk operations)
jit = off

# Increase random page cost for better bulk sequential scan performance
random_page_cost = 1.1

# Increase effective_io_concurrency for SSD storage
effective_io_concurrency = 200

# ============================================================================
# AUTOVACUUM - DISABLED DURING BULK LOAD
# ============================================================================

# Disable autovacuum during bulk import (re-enable after!)
# Tables should be manually VACUUM ANALYZED after import
autovacuum = off

# ============================================================================
# CONNECTION SETTINGS
# ============================================================================

# Increase max connections if using parallel workers
max_connections = 50

# ============================================================================
# LOGGING - HELPFUL FOR MONITORING BULK IMPORT
# ============================================================================

# Log long-running statements (useful for debugging)
log_min_duration_statement = 10000  # Log queries taking > 10s

# Log checkpoints (monitor I/O pressure)
log_checkpoints = on

# Log autovacuum (should be quiet during bulk load)
log_autovacuum_min_duration = 0

# ============================================================================
# PARALLEL QUERY EXECUTION
# ============================================================================

# Increase parallel workers for index creation
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4
max_parallel_workers = 8

# ============================================================================
# NOTES FOR PRODUCTION
# ============================================================================

# After bulk load is complete, you should:
# 1. Run VACUUM ANALYZE on all tables
# 2. Re-enable autovacuum (autovacuum = on)
# 3. Consider enabling synchronous_commit (synchronous_commit = on)
# 4. Reduce checkpoint_timeout and max_wal_size to normal values
# 5. Restart PostgreSQL with production settings

# To apply these settings:
# - Mount this file in Docker: -v ./postgres-bulk-load.conf:/etc/postgresql/postgresql.conf
# - Start PostgreSQL with: postgres -c config_file=/etc/postgresql/postgresql.conf
